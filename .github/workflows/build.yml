name: Build and Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prepare Yarn
        run: |
          corepack enable
          corepack prepare yarn@4.7.0 --activate

      - name: Install dependencies
        run: yarn install

      - name: Generate manifest
        run: yarn run build:prepare

      - name: Build background
        run: yarn run build:background

      - name: Build content script
        run: yarn run build:js

      - name: Build web
        run: yarn run build:web

      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: tusk-extension
          path: extension/
          retention-days: 30

  build-zip:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prepare Yarn
        run: |
          corepack enable
          corepack prepare yarn@4.7.0 --activate

      - name: Install dependencies
        run: yarn install

      - name: Generate manifest
        run: yarn run build:prepare

      - name: Build background
        run: yarn run build:background

      - name: Build content script
        run: yarn run build:js

      - name: Build web
        run: yarn run build:web

      - name: Create ZIP
        run: |
          cd extension
          zip -r ../tusk-release.zip .

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: tusk-release-zip
          path: tusk-release.zip
          retention-days: 30

  release:
    runs-on: ubuntu-latest
    needs: build-zip
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: tusk-release-zip
          path: release

      - name: Get version
        id: version
        run: echo "version=$(node -p \"require('./package.json').version\")" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version.outputs.version }}
          files: release/tusk-release.zip
          generate_release_notes: true
