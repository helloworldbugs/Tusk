name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Yarn 1.x
        run: npm install -g yarn

      - name: Remove old lockfile for Yarn 1.x
        run: rm -f yarn.lock

      - name: Install dependencies
        run: yarn install

      - name: Generate manifest
        run: yarn run build:prepare

      - name: Build background
        run: yarn run build:background

      - name: Build content script
        run: yarn run build:js

      - name: Build web
        run: yarn run build:web

      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: tusk-extension
          path: extension/
          retention-days: 30
